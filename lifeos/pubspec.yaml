name: lifeos
description: >
  Demon Origin — a premium, offline-first personal operating system combining
  Finance, Fitness, Habits, Goals, Creator Studio, Entertainment, Journal,
  Calendar and Gamification into a single Android app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Local database (offline-first, SQLite via Drift)
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ^2.4.6
  path_provider: ^2.1.4
  path: ^1.9.0

  # Routing
  go_router: ^14.6.1

  # Notifications & biometrics
  flutter_local_notifications: ^18.0.1
  # zonedSchedule (the only scheduling API flutter_local_notifications
  # 16+ exposes) needs an IANA timezone, hence both packages below.
  timezone: ^0.9.4
  flutter_timezone: ^2.1.0
  local_auth: ^2.3.0

  # Formatting & utility
  intl: ^0.19.0
  uuid: ^4.5.1

  # Charts (finance & habit analytics)
  fl_chart: ^0.69.2

  # Camera/gallery photo capture (Fitness progress photos)
  image_picker: ^1.1.2

  # Fonts / visuals
  google_fonts: ^6.2.1

  # Small persisted preferences (theme mode, onboarding flags, etc.)
  shared_preferences: ^2.3.3

  # Backup export/restore: picking a backup file to restore, and
  # sharing an exported one to wherever the user wants to save it.
  file_picker: ^8.1.3
  share_plus: ^10.1.2

  # Android home screen widget
  home_widget: ^0.6.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.3
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
