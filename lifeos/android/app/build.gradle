plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "0.1.0"

android {
    namespace "com.lifeos.app"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // flutter_local_notifications' AAR declares a minSdk requirement
        // that needs this enabled, regardless of our own minSdk 23.
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // Personal, unpublished app — change this if you ever plan to
        // publish it, since it can't be changed after a Play Store release.
        applicationId "com.lifeos.app"
        // local_auth's BiometricPrompt API needs API 23+.
        minSdk 23
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        debug {
            // A fixed, repo-committed keystore (debug.keystore, right next
            // to this file) instead of Gradle's per-machine default
            // ~/.android/debug.keystore. Every CI runner generates its own
            // random debug key otherwise, so each release build had a
            // different signature — Android refuses to install an update
            // whose signature doesn't match the currently-installed app,
            // silently failing unless you'd uninstalled the old one first.
            // This is a debug-only key (never used for a real release), so
            // committing it is standard practice, not a secret leak.
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            // TODO: wire up a real release signing config before
            // publishing; the fixed debug config above is fine for
            // personal sideloading and keeps update installs working.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    // Required by compileOptions.coreLibraryDesugaringEnabled above.
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
